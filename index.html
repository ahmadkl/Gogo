<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الذكاء الاصطناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDF1;--panel:#fff;--ink:#0F1B2D;--muted:#5B6B7E;--accent:#0E7C86;--hot:#C2185B;--line:#CBD5DE}
@media (prefers-color-scheme:dark){:root{--bg:#101820;--panel:#18232F;--ink:#E6EDF3;--muted:#93A4B5;--accent:#35B6C1;--hot:#F06292;--line:#2B3A49}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Tajawal,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font:600 22px 'Reem Kufi',sans-serif;margin:0;flex:1}
nav{display:flex;gap:4px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);font:500 15px Tajawal;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px}
textarea{min-height:84px;resize:vertical}
button.go{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:700 16px Tajawal;cursor:pointer;margin-top:12px}
button.alt{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
#msgs{min-height:240px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.m{padding:9px 13px;border-radius:12px 12px 12px 3px;max-width:88%;white-space:pre-wrap}
.m.u{background:var(--accent);color:#fff;align-self:flex-start;border-radius:12px 12px 3px 12px}
.m.a{background:var(--bg);align-self:flex-end}
img.res,video{width:100%;border-radius:8px;margin-top:10px;background:#000}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--hot);transition:width .4s}
.muted{color:var(--muted);font-size:14px}
.tag{font-size:13px;color:var(--hot)}
#thumb{max-height:90px;border-radius:6px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>استوديو الذكاء الاصطناعي</h1></header>
<nav id="tabs">
  <button data-t="chat" class="on">دردشة</button><button data-t="img">صور</button>
  <button data-t="vid">فيديو</button><button data-t="chr">شخصيات</button><button data-t="set">إعدادات</button>
</nav>
<main>

<section id="chat" class="on">
  <div class="card"><div id="msgs"></div>
    <label for="q">رسالتك</label><textarea id="q" placeholder="اسأل أي شيء، أو اطلب كتابة وصف لمشهد"></textarea>
    <div class="row"><button class="go" id="send">إرسال</button><button class="alt" id="clr" style="align-self:flex-end">محادثة جديدة</button></div>
  </div>
</section>

<section id="img">
  <div class="card">
    <label for="ip">وصف الصورة</label><textarea id="ip"></textarea>
    <div class="row">
      <div><label for="isz">الحجم</label><select id="isz"><option value="1024x1024">مربّع</option><option value="1344x768">عريض</option><option value="768x1344">طولي</option></select></div>
      <div><label for="imd">النموذج</label><select id="imd"><option>flux</option><option>turbo</option></select></div>
      <div><label for="ich">الشخصية</label><select id="ich" class="chsel"></select></div>
    </div>
    <button class="go" id="igen">إنشاء الصورة</button>
    <div id="iout"></div>
  </div>
</section>

<section id="vid">
  <div class="card">
    <div class="row">
      <div><label for="vm">النوع</label><select id="vm"><option value="text">نص إلى فيديو</option><option value="image">تحريك صورة</option></select></div>
      <div><label for="vch">الشخصية</label><select id="vch" class="chsel"></select></div>
    </div>
    <div id="vimgbox" hidden><label for="vf">الصورة</label><input type="file" id="vf" accept="image/*"><img id="thumb" alt="" hidden></div>
    <label for="vp">وصف المشهد والحركة</label><textarea id="vp"></textarea>
    <div class="row">
      <div><label for="vt">المدة الكلية: <b id="vtl">10</b> ثانية</label><input type="range" id="vt" min="10" max="600" step="5" value="10"></div>
      <div><label for="vc">طول كل مقطع</label><select id="vc"><option value="5">5 ثوان</option><option value="8">8 ثوان</option><option value="10">10 ثوان</option></select></div>
    </div>
    <p class="muted" id="vest"></p>
    <button class="go" id="vgen">إنشاء الفيديو</button>
  </div>
  <div id="jobs"></div>
</section>

<section id="chr">
  <div class="card">
    <label for="cn">اسم الشخصية</label><input id="cn">
    <label for="cd">وصف ثابت (الشكل، الملابس، الألوان)</label><textarea id="cd" placeholder="مثال: فتاة بشعر أسود قصير، جاكيت أحمر، عيون عسلية"></textarea>
    <div class="row">
      <div><label for="cs">البذرة (Seed)</label><input id="cs" type="number"></div>
      <div><label for="cf">صورة مرجعية (اختياري)</label><input id="cf" type="file" accept="image/*"></div>
    </div>
    <button class="go" id="csave">حفظ الشخصية</button>
  </div>
  <div id="clist"></div>
</section>

<section id="set">
  <div class="card">
    <label for="api">عنوان خادم الفيديو</label><input id="api" dir="ltr" placeholder="http://localhost:8000">
    <button class="go" id="apisave">حفظ</button> <button class="alt" id="apitest">اختبار الاتصال</button>
    <p class="muted" id="apist"></p>
    <p class="muted">الدردشة والصور تعمل مباشرة من المتصفح. الفيديو يحتاج تشغيل مجلد server (راجع README).</p>
  </div>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

// ---- التبويبات
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t))});

// ---- الشخصيات
let chars=st.get('chars',[]);
const charById=id=>chars.find(c=>c.id===id);
function fileToData(file,max=640){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}
function renderChars(){
  $$('.chsel').forEach(s=>{s.replaceChildren(new Option('بدون شخصية',''),...chars.map(c=>new Option(c.name,c.id)))});
  const l=$('#clist');l.replaceChildren();
  if(!chars.length){l.append(el('p','muted','لا توجد شخصيات بعد. أضف شخصية لتثبيت شكلها في الصور والفيديو.'));return}
  chars.forEach(c=>{const d=el('div','card');d.append(el('b','',c.name),el('p','muted',c.desc+' | seed '+c.seed));
    if(c.ref){const i=el('img');i.src=c.ref;i.style.maxHeight='90px';i.style.borderRadius='6px';i.alt=c.name;d.append(i)}
    const x=el('button','alt','حذف');x.onclick=()=>{chars=chars.filter(k=>k.id!==c.id);st.set('chars',chars);renderChars()};d.append(el('br'),x);l.append(d)})
}
$('#cs').value=Math.floor(Math.random()*1e6);
$('#csave').onclick=async()=>{
  const name=$('#cn').value.trim(),desc=$('#cd').value.trim();if(!name||!desc)return alert('أدخل الاسم والوصف');
  const f=$('#cf').files[0];
  chars.push({id:'c'+Date.now(),name,desc,seed:+$('#cs').value||0,ref:f?await fileToData(f):null});
  st.set('chars',chars);$('#cn').value=$('#cd').value='';$('#cf').value='';$('#cs').value=Math.floor(Math.random()*1e6);renderChars()};

// ---- الدردشة (Pollinations، بدون مفتاح)
let hist=st.get('chat',[]);
const SYS='أنت مساعد ذكي ودود. أجب بنفس لغة المستخدم بإيجاز ووضوح. وعند طلب وصف لصورة أو فيديو اكتب وصفًا بصريًا مفصلًا.';
function renderChat(){const m=$('#msgs');m.replaceChildren(...hist.map(h=>el('div','m '+(h.role==='user'?'u':'a'),h.content)));m.scrollTop=m.scrollHeight}
$('#send').onclick=async()=>{
  const t=$('#q').value.trim();if(!t)return;$('#q').value='';hist.push({role:'user',content:t});renderChat();
  const wait=el('div','m a','...');$('#msgs').append(wait);
  try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:SYS},...hist.slice(-20)]})});
    const j=await r.json();hist.push({role:'assistant',content:j.choices?.[0]?.message?.content||'لم يصل رد. حاول مرة أخرى.'})}
  catch(e){hist.push({role:'assistant',content:'تعذّر الاتصال بخدمة الدردشة. تحقق من الإنترنت وأعد المحاولة.'})}
  st.set('chat',hist.slice(-40));renderChat()};
$('#clr').onclick=()=>{hist=[];st.set('chat',[]);renderChat()};

// ---- الصور
function genImage(){
  const t=$('#ip').value.trim();if(!t)return;const c=charById($('#ich').value),[w,h]=$('#isz').value.split('x');
  const p=(c?c.desc+'. ':'')+t,seed=c?c.seed:Math.floor(Math.random()*1e6);
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=${w}&height=${h}&seed=${seed}&model=${$('#imd').value}&nologo=true`;
  const o=$('#iout');o.replaceChildren(el('p','muted','جارٍ إنشاء الصورة...'));
  const im=el('img','res');im.alt=t;im.onload=()=>{
    const a=el('a','','تحميل');a.href=url;a.target='_blank';a.className='alt';
    const b=el('button','alt','حرّك هذه الصورة');b.style.marginInlineStart='8px';b.onclick=async()=>{
      const blob=await (await fetch(url)).blob();const fr=new FileReader();fr.onload=()=>{vidImage=fr.result;$('#vm').value='image';syncVid();$('#thumb').src=vidImage;$('#thumb').hidden=false;$('#vp').value=$('#vp').value||'حركة سينمائية هادئة للكاميرا';document.querySelector('[data-t=vid]').click()};fr.readAsDataURL(blob)};
    o.replaceChildren(im,el('br'),a,b)};
  im.onerror=()=>o.replaceChildren(el('p','tag','فشل إنشاء الصورة. غيّر الوصف أو أعد المحاولة.'));im.src=url}
$('#igen').onclick=genImage;

// ---- الفيديو
let API=st.get('api','http://localhost:8000'),vidImage=null,jobs=st.get('jobs',[]);
$('#api').value=API;
$('#apisave').onclick=()=>{API=$('#api').value.trim().replace(/\/$/,'');st.set('api',API);$('#apist').textContent='تم الحفظ'};
$('#apitest').onclick=async()=>{try{const j=await (await fetch(API+'/api/health')).json();$('#apist').textContent='متصل. المزوّد: '+j.provider}catch{$('#apist').textContent='تعذّر الاتصال بالخادم. تأكد أنه يعمل وأن العنوان صحيح.'}};
function syncVid(){$('#vimgbox').hidden=$('#vm').value!=='image';est()}
function est(){const t=+$('#vt').value,c=+$('#vc').value;$('#vtl').textContent=t;$('#vest').textContent=`سيُولَّد ${Math.ceil(t/c)} مقطعًا ثم تُدمج. كل مقطع يستغرق دقائق على نموذج مجاني.`}
$('#vm').onchange=syncVid;$('#vt').oninput=est;$('#vc').onchange=est;est();
$('#vf').onchange=async e=>{const f=e.target.files[0];if(!f)return;vidImage=await fileToData(f,1024);$('#thumb').src=vidImage;$('#thumb').hidden=false};
async function api(path,body){const r=await fetch(API+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);if(!r.ok){let m='خطأ';try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r.json()}
$('#vgen').onclick=async()=>{
  const p=$('#vp').value.trim();if(!p)return alert('اكتب وصف المشهد');
  const c=charById($('#vch').value),mode=$('#vm').value;
  let img=vidImage||(c&&c.ref)||null;if(mode==='image'&&!img)return alert('اختر صورة أو شخصية لها صورة مرجعية');
  try{const j=await api('/api/video/jobs',{mode,prompt:p,image_b64:mode==='image'?img:null,total_seconds:+$('#vt').value,clip_seconds:+$('#vc').value,seed:c?c.seed:Math.floor(Math.random()*1e6),character_desc:c?c.desc:''});
    jobs.unshift({id:j.id,prompt:p,char:c?c.id:''});st.set('jobs',jobs);renderJobs();poll()}
  catch(e){alert(e.message==='Failed to fetch'?'تعذّر الاتصال بخادم الفيديو. راجع تبويب الإعدادات.':e.message)}};
const info={};
function renderJobs(){
  const box=$('#jobs');box.replaceChildren();
  jobs.forEach(j=>{const s=info[j.id]||{status:'queued',progress:0};const d=el('div','card');
    d.append(el('b','',j.prompt.slice(0,80)),el('p','muted',s.status==='done'?'جاهز':s.status==='error'?'فشل: '+s.error:s.status==='running'?`قيد التوليد: مقطع ${s.clips_done}/${s.clips_total}`:'في الانتظار'));
    if(s.status!=='done'&&s.status!=='error'){const b=el('div','bar'),i=el('i');i.style.width=s.progress+'%';b.append(i);d.append(b)}
    if(s.status==='done'){const v=el('video');v.controls=true;v.src=API+s.url;v.preload='metadata';d.append(v);
      const a=el('a','alt','تحميل');a.href=API+s.url;a.download='video.mp4';d.append(a);
      const n=el('input');n.type='number';n.min=5;n.max=300;n.value=10;n.style.width='90px';n.style.margin='0 8px';n.setAttribute('aria-label','ثوان إضافية');
      const x=el('button','alt','مدّد الفيديو (ثوان)');x.onclick=async()=>{const c=charById(j.char);try{const r=await api(`/api/video/jobs/${j.id}/extend`,{prompt:'',extra_seconds:+n.value,seed:c?c.seed:0,character_desc:c?c.desc:''});jobs.unshift({id:r.id,prompt:j.prompt+' (تمديد)',char:j.char});st.set('jobs',jobs);renderJobs();poll()}catch(e){alert(e.message)}};
      d.append(el('br'),n,x)}
    const del=el('button','alt','إزالة من القائمة');del.style.marginTop='8px';del.onclick=()=>{jobs=jobs.filter(k=>k!==j);st.set('jobs',jobs);renderJobs()};d.append(el('br'),del);box.append(d)})}
let timer=null;
async function poll(){
  clearTimeout(timer);let busy=false;
  for(const j of jobs){const cur=info[j.id];if(cur&&(cur.status==='done'||cur.status==='error'))continue;
    try{info[j.id]=await api('/api/video/jobs/'+j.id)}catch{info[j.id]={status:'error',error:'الخادم غير متاح أو انتهت المهمة'}}
    if(info[j.id].status!=='done'&&info[j.id].status!=='error')busy=true}
  renderJobs();if(busy)timer=setTimeout(poll,3000)}

renderChars();renderChat();renderJobs();poll();
</script>
</body>
</html>
